[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "systematic-equity-research"
version = "0.1.0"
description = "Signal research and evaluation framework for systematic equity strategies"
requires-python = ">=3.11"
dependencies = [
    "pandas", "numpy", "scipy", "scikit-learn", "statsmodels",
    "yfinance", "requests", "pyarrow", "beautifulsoup4", "lxml",
    "python-dotenv", "hmmlearn", "empyrical-reloaded",
]

[project.optional-dependencies]
dev = ["pytest"]
broker = ["alpaca-py"]

[tool.setuptools]
# Only the library ships as a package. `research/` holds one-off analysis
# scripts and `tests/` the suite; neither is importable code.
packages = ["algo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
